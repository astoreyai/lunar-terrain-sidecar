# CI for lunar-terrain-sidecar.
#
# The core job runs everything that needs no local datasets, no Godot and no
# Chromium: typecheck plus the test files verified (by running the suite with
# the dataset directories masked) to pass without
# /mnt/projects/datasets/{spice_kernels,lola_5mpp} present.
#
#   - lunar-features, protocol, construction, history, sync,
#     lunar-solar.ephemeris: fully dataset-free. The one protocol test that
#     needs a real DEM (the concurrency race window) skips itself when the
#     DEM is absent.
#   - lunar-solar.de and lunar-dem.real-data: gated on kernel/DEM presence
#     with describe.skipIf — included here deliberately so the skip path
#     (skip loudly, never fake-pass) is exercised in CI.
#
# To run the gated suites for real, fetch the public data first:
#   bash scripts/fetch-data.sh   (see the script for env/config pointers)

name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: typecheck + dataset-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (no local datasets, no Godot, no Chromium)
        run: >-
          npx vitest run
          tests/lunar-features.test.ts
          tests/protocol.test.ts
          tests/construction.test.ts
          tests/history.test.ts
          tests/sync.test.ts
          tests/lunar-solar.ephemeris.test.ts
          tests/lunar-solar.de.test.ts
          tests/lunar-dem.real-data.test.ts

  # These suites need what a hosted runner does not have:
  #   - interactive-ui.test.ts: real Chromium (playwright) + WebGL, and the
  #     PGDA Site01 DEM on disk;
  #   - godot-roundtrip.test.ts / godot-integration.test.ts: a Godot 4
  #     editor binary on PATH plus the same DEM;
  #   - parallel.test.ts: passes without the DEM but its DEM-grounded
  #     byte-identity case skips.
  # They are kept as a visible, optional job (continue-on-error) rather than
  # silently omitted, so the requirement is documented where CI lives.
  heavy-optional:
    name: UI + Godot suites (needs DEM, Godot, Chromium — expected to skip/fail on hosted runners)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for playwright
        run: npx playwright install --with-deps chromium

      - name: UI + Godot + parallel suites
        run: >-
          npx vitest run
          tests/parallel.test.ts
          tests/interactive-ui.test.ts
          tests/godot-roundtrip.test.ts
          tests/godot-integration.test.ts
